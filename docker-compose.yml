# StockRoom — local development stack.
#   docker compose up --build
#   SPA   http://localhost:4200
#   API   http://localhost:3000/api
#   Docs  http://localhost:3000/api/docs

services:
  db:
    image: postgres:18-alpine
    container_name: stockroom_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
      POSTGRES_DB: stockroom
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The backend waits on this: it runs migrations at startup and would exit
      # non-zero if it raced Postgres' first-boot initialisation.
      test: ['CMD-SHELL', 'pg_isready -U stockroom -d stockroom']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockroom_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stockroom:stockroom@db:5432/stockroom
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 24h
      PORT: '3000'
      FRONTEND_URL: '*'
      SEED_PASSWORD: ${SEED_PASSWORD:-Demo1234!}
    ports:
      - '3000:3000'
    healthcheck:
      # Liveness only — /api/health touches no dependency, so a brief database
      # blip cannot get a healthy container restarted.
      test:
        ['CMD-SHELL', 'node -e "fetch(''http://localhost:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockroom_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # nginx serves the SPA and proxies /api/ through to the backend service.
      - '4200:80'

volumes:
  postgres_data:
